server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # Rotas da API — proxy para o backend (Fastify na porta 3333)
    # Container name: agendabot_api (docker-compose) / EasyPanel internal hostname
    location ~ ^/(whatsapp|auth|appointments|chatbot|health|docs)(/|$) {
        proxy_pass http://agendabot_api:3333;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Assets estáticos com cache longo
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — todas as rotas voltam ao index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
